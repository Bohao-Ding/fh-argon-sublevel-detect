[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fh-thin-layer-transport"
version = "0.1.0"
description = "Differentiable thin-layer transport model for argon Franck-Hertz curves"
requires-python = ">=3.11"
dependencies = [
  "matplotlib",
  "numpy",
  "openpyxl",
  "pandas",
  "scipy",
  "torch",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

